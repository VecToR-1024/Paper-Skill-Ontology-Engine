schema_version: "0.1.0"

base_types:
  id:
    description: "Stable object identifier."
    scalar: string
  string:
    description: "Short text value."
    scalar: string
  text:
    description: "Long-form text value."
    scalar: string
  datetime:
    description: "ISO 8601 timestamp with timezone when available."
    scalar: string
  enum:
    description: "Value must be one of a named enum."
    scalar: string
  ref:
    description: "Reference to another object id."
    scalar: string
  path:
    description: "Workspace-relative or absolute artifact path."
    scalar: string
  uri:
    description: "External URL or stable URI."
    scalar: string
  integer:
    description: "Integer number."
    scalar: integer
  number:
    description: "Numeric value."
    scalar: number
  boolean:
    description: "Boolean value."
    scalar: boolean
  json:
    description: "Structured payload that is validated by a specific workflow."
    scalar: object

common_properties:
  base_object:
    id:
      type: id
      required: true
    created_at:
      type: datetime
      required: true
    updated_at:
      type: datetime
      required: false
    created_by:
      type: enum
      enum: ActorType
      required: true
    status:
      type: enum
      enum: ObjectStatus
      required: true

